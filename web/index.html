<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>VeriNexus</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Aplica tema e tamanho da letra antes de pintar, para não piscar.
    try {
      const p = JSON.parse(localStorage.getItem('verinexus-prefs')) || {};
      if (p.theme) document.documentElement.dataset.theme = p.theme;
      if (p.text === 'lg') document.documentElement.dataset.text = 'lg';
    } catch {}
  </script>
</head>
<body>
  <a class="btn skip-link" href="#view">Pular para o conteúdo</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="VeriNexus, página inicial">
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path class="logo-shield" d="M16 2.5 5 6.6v8.2c0 6.9 4.6 12 11 14.2 6.4-2.2 11-7.3 11-14.2V6.6L16 2.5Z"/>
          <path class="logo-line" d="M10.5 15.8l3.7 3.7 7.3-7.6" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>VeriNexus</span>
      </a>
      <nav class="nav-top" aria-label="Principal" data-nav></nav>
      <div class="prefs">
        <button type="button" class="btn btn-quiet" data-pref="text"></button>
        <button type="button" class="btn btn-quiet" data-pref="theme"></button>
      </div>
    </div>
  </header>

  <main id="view" class="page" tabindex="-1"></main>

  <footer class="footer">
    <p><strong>Pare. Confirme. Só depois aja.</strong></p>
    <p>Protótipo do Ideathon Piauí 2026. Tudo aqui é simulado e todos os dados são fictícios.</p>
  </footer>

  <nav class="tabbar" aria-label="Atalhos" data-nav></nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
